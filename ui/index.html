<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DeepSeek Harness</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        display: grid;
        place-items: center;
        background: #11111b;
        color: #cdd6f4;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .box {
        text-align: center;
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 16px;
        border-radius: 18px;
        background: #1e1e2e;
        display: grid;
        place-items: center;
      }
      .spin {
        width: 34px;
        height: 34px;
        border: 4px solid #313244;
        border-top-color: #89b4fa;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 18px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .hint {
        font-size: 13px;
        color: #6c7086;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spin"></div>
      <div>Starting DeepSeek Harness…</div>
      <div class="hint">The interface opens once dsh web is ready</div>
    </div>
  </body>
</html>
